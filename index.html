<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Equinox_</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Gowun+Batang:wght@400;700&family=Pinyon+Script&display=swap" rel="stylesheet">
<style>
/* VOICE: 고요하고 격식 있는 세계관 소개, 낮과 밤의 대비
   IDEA: 왕궁 서고에 걸린 서열 문장(紋章) 두루마리
   PICTURE: 붉은 낮과 은빛 밤 두 인물의 배너, 그 아래 위계도
   COLOUR and TYPE: 칠흑 바탕, 진홍(낮) + 월은(밤), Gowun Batang / Pinyon Script
   LAYOUT: 중앙 정렬 한 기둥, 서열 순으로 1-4-1 배치 */
:root{color-scheme:dark;--bg:#07060a;--panel:#111018;--line:#2a2733;--ink:#ecebf1;--mute:#a19fab;--day:#d0283a;--night:#c9cede}
*{box-sizing:border-box;min-width:0}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.7 "Gowun Batang",serif;overflow-x:clip}
body::before{content:"";position:fixed;inset:0;pointer-events:none;background:radial-gradient(60% 40% at 15% 0%,rgba(208,40,58,.14),transparent 70%),radial-gradient(60% 40% at 85% 0%,rgba(201,206,222,.10),transparent 70%)}
main{position:relative;max-width:880px;margin:0 auto;padding:0 max(5vw,16px) 80px}
.profile{display:flex;align-items:center;gap:12px;padding:clamp(16px,3vw,28px) 0 16px}
.profile img{width:52px;height:52px;border-radius:50%;object-fit:cover;flex:none;border:1.5px solid var(--night);box-shadow:0 0 0 3px var(--bg),0 0 0 4px var(--day)}
.profile b{display:block;font-size:17px;line-height:1.2}
.profile span{display:block;font-size:14px;color:var(--mute)}
.hero{position:relative;margin:0 auto;border-radius:6px;overflow:hidden;border:1px solid var(--line);box-shadow:0 30px 80px -30px rgba(208,40,58,.35)}
.hero img{display:block;width:100%;aspect-ratio:1280/512;object-fit:cover}
.hero::after{content:"";position:absolute;inset:0;background:linear-gradient(transparent 55%,rgba(7,6,10,.55))}
.welcome{text-align:center;margin:28px 0 8px;font-size:clamp(17px,2.4vw,20px);line-height:1.6;color:#f3f1f7;text-wrap:balance;word-break:keep-all;text-shadow:0 1px 10px rgba(0,0,0,.8)}
.welcome b{font-weight:700;color:#ffffff}.welcome .d{color:#ff6f7d}.welcome .n{color:#cfd8ff}
.sub{text-align:center;color:var(--mute);font-size:14px;margin:-16px 0 32px}
.divider{height:1px;max-width:520px;margin:56px auto 36px;background:linear-gradient(90deg,transparent,rgba(201,206,222,.35),transparent)}
.tier{display:flex;flex-wrap:wrap;justify-content:center;gap:12px}
.tier+.tier{margin-top:28px}
.rank{appearance:none;border:1px solid var(--line);background:var(--panel);color:var(--ink);font:inherit;font-size:clamp(16px,2.2vw,19px);font-weight:700;padding:14px 22px;min-height:48px;border-radius:4px;cursor:pointer;flex:1 1 150px;max-width:200px;position:relative;transition:border-color .25s,transform .25s}
.rank.top{max-width:280px;flex-basis:240px;font-size:clamp(18px,2.6vw,22px)}
.ico{display:block;width:22px;height:22px;margin:0 auto 6px;color:var(--night)}.ico-star,.ico-moon{color:#e6dfb8}.ico-axe{color:var(--night)}.ico-cross{color:#f1e7c9}.ico-magic{color:#e4c9ff}.ico-hourglass{color:#b9b3c4}.ico-sins{color:#b08ad0}.ico-invcross{color:var(--day)}.ico.big{width:34px;height:34px;margin-bottom:12px}.empty{text-align:center;color:var(--mute);border:1px dashed var(--line);border-radius:4px;padding:28px 16px;margin:0}
.rank small{display:block;font-weight:400;font-size:13px;color:var(--mute)}
.rank:hover{border-color:#4a4656;transform:translateY(-2px)}
.rank:focus-visible{outline:2px solid var(--night);outline-offset:3px}
.rank[aria-expanded=true]{border-color:var(--day);box-shadow:0 0 0 1px var(--day) inset}
.detail{margin-top:36px;border:1px solid var(--line);border-radius:6px;background:linear-gradient(180deg,#13111a,#0c0b10);padding:clamp(20px,4vw,36px)}
.detail[hidden]{display:none}
.detail h2{margin:0;font-size:clamp(26px,4vw,34px);line-height:1.1;text-align:center}
.detail .lead{text-align:center;color:var(--mute);margin:10px auto 26px;max-width:56ch}
.cards{display:flex;justify-content:center;gap:14px}
.cards.row+.cards.row{margin-top:14px}
.cards .card{flex:0 0 calc((100% - 28px) / 3)}
.card{border:1px solid var(--line);border-radius:4px;padding:18px;background:rgba(255,255,255,.02)}
.card .no{font:22px/1 "Pinyon Script",cursive;color:var(--day)}
.card:nth-child(even) .no{color:var(--night)}
.card h3{margin:6px 0 4px;font-size:18px}
.card .title{font-size:13px;color:var(--mute);margin:0 0 8px}
.rank-prose{margin:0 auto 30px !important;padding-bottom:26px;border-bottom:1px solid var(--line);font-size:16px !important}
.sub-h{margin:34px 0 14px;text-align:center;font-size:clamp(19px,2.6vw,22px);line-height:1.3;color:#e8dcb5;text-wrap:balance}
.card .pos{margin:4px 0 0;font-size:13px;color:var(--mute)}
.card h3{font-size:22px;margin:2px 0 4px}
.card .title{margin:0;font-size:15px;color:#d8d3de}
.card.has-img{padding-top:0;overflow:hidden}
.por{display:block;width:calc(100% + 36px);margin:0 -18px 12px;padding:0;border:0;background:#000;cursor:zoom-in;aspect-ratio:3/4;overflow:hidden}
.por img{display:block;width:100%;height:100%;object-fit:cover;object-position:50% 15%;transition:transform .5s}
.por:hover img{transform:scale(1.04)}
.por:focus-visible{outline:2px solid var(--night);outline-offset:-2px}
.lb{position:fixed;inset:0;z-index:10;background:rgba(5,4,8,.92);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:12px;padding:20px;cursor:zoom-out}
.lb[hidden]{display:none}
.lb img{max-width:100%;max-height:calc(100vh - 90px);border-radius:4px;box-shadow:0 20px 60px rgba(0,0,0,.6)}
.lb p{margin:0;font-size:17px}
.card.sealed{border-style:dashed;opacity:.55}
.card.sealed h3{letter-spacing:.2em}
.region{text-align:center;margin:0 0 6px;font-size:14px;color:var(--day)}
.han{text-align:center;margin:8px 0 0;color:var(--mute);font-size:14px}
@media(max-width:600px){.cards{gap:8px}.cards.row+.cards.row{margin-top:8px}.cards .card{flex-basis:calc((100% - 16px) / 3);padding:10px}.cards .por{width:calc(100% + 20px);margin:0 -10px 8px}.cards .card h3{font-size:16px}.cards .card .title,.cards .card .pos{font-size:12px}.cards .card .no{font-size:17px}}
.close{display:block;margin:26px auto 0;appearance:none;background:none;border:1px solid var(--line);color:var(--mute);font:inherit;font-size:14px;padding:10px 20px;min-height:44px;border-radius:4px;cursor:pointer}
.close:hover{color:var(--ink)}
.world-h{text-align:center;font-size:clamp(26px,4vw,34px);line-height:1.1;margin:0 0 28px}
.lore{position:relative;border:1px solid var(--line);border-radius:6px;padding:clamp(24px,5vw,48px) clamp(20px,5vw,44px);background:radial-gradient(80% 60% at 50% 0%,rgba(228,201,255,.08),transparent 70%),linear-gradient(180deg,#13111a,#0c0b10);overflow:hidden}
.lore+.lore{margin-top:20px}
.lore .tree{display:block;width:64px;height:64px;margin:0 auto 14px;color:#e8dcb5}
.lore .kicker{text-align:center;margin:0;font-size:14px;color:var(--day)}
.lore h3{text-align:center;margin:6px 0 4px;font-size:clamp(28px,4.4vw,38px);line-height:1.1}
.lore .epi{text-align:center;margin:0;color:var(--mute);font-size:15px}
.lore blockquote{margin:30px auto;text-align:center;font-size:clamp(14px,4vw,24px);line-height:1.5;padding:22px 0;border-block:1px solid var(--line);white-space:nowrap}
.lore blockquote small{display:block;white-space:normal;margin-top:8px;font-size:13px;color:var(--mute)}
.prose{max-width:62ch;margin:0 auto;font-size:17px;line-height:1.9;text-align:left;word-break:keep-all;overflow-wrap:break-word}.prose p{margin:0 0 1.1em}.prose p:last-child{margin:0}
.lore dl{display:grid;grid-template-columns:minmax(0,7em) minmax(0,1fr);gap:16px 24px;margin:0 auto;max-width:640px}
.lore dt{font-weight:700;color:#e8dcb5}
.lore dd{margin:0}
@media(max-width:600px){.prose{max-width:62ch;margin:0 auto;font-size:17px;line-height:1.9;text-align:left;word-break:keep-all;overflow-wrap:break-word}.prose p{margin:0 0 1.1em}.prose p:last-child{margin:0}
.lore dl{grid-template-columns:minmax(0,1fr);gap:4px}.lore dd{margin-bottom:14px}}
.world-sub{text-align:center;font-size:clamp(26px,4vw,34px);line-height:1.1;margin:0 0 28px}
.lands{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:12px}
.land{appearance:none;font:inherit;color:inherit;text-align:inherit;padding:0;cursor:pointer;border:1px solid var(--line);border-radius:6px;background:linear-gradient(180deg,#13111a,#0c0b10);display:flex;flex-direction:column;overflow:hidden;transition:border-color .25s,transform .25s}
.land:hover{border-color:#4a4656;transform:translateY(-2px)}
.land:focus-visible{outline:2px solid var(--night);outline-offset:3px}
.land[aria-expanded=true]{border-color:var(--day);box-shadow:0 0 0 1px var(--day) inset}
.land .pic{position:relative;display:block;aspect-ratio:2/3;overflow:hidden;width:100%}
.land .pic img{display:block;width:100%;height:100%;object-fit:cover;transition:transform .6s}
.land:hover .pic img{transform:scale(1.04)}
.land .pic::after{content:"";position:absolute;inset:0;background:linear-gradient(transparent 55%,rgba(7,6,10,.92))}
.land .nm{position:absolute;left:0;right:0;bottom:14px;z-index:1;text-align:center;font-weight:700;font-size:clamp(19px,2.4vw,24px);line-height:1.15;text-shadow:0 2px 12px #000}
.land .sum{display:block;padding:14px 14px 4px;text-align:center;font-size:15px;line-height:1.6;word-break:keep-all;flex:1}
.land .more{display:block;padding:8px 14px 14px;text-align:center;font-size:13px;color:var(--mute)}
.land[aria-expanded=true] .more{color:var(--day)}
.land-detail{margin-top:16px;border:1px solid var(--line);border-radius:6px;background:linear-gradient(180deg,#13111a,#0c0b10);padding:clamp(22px,4vw,40px)}
.land-detail[hidden]{display:none}
.land-detail h4{margin:0 0 6px;text-align:center;font-size:clamp(24px,3.6vw,30px);line-height:1.1}
.land-detail .lsum{margin:0 0 22px;text-align:center;color:var(--mute);font-size:15px}
.land-detail .who{max-width:62ch;margin:22px auto 0;padding-top:14px;border-top:1px solid var(--line);font-size:14px;color:var(--mute);text-align:center}
.land-detail .who a{color:var(--ink);text-decoration:none;border-bottom:1px solid #4a4656;margin:0 6px;display:inline-block;padding:8px 0;font-size:15px}
.land-detail .who a:hover{border-color:var(--day)}
@media(prefers-reduced-motion:no-preference){.land-detail:not([hidden]){animation:rise .45s ease}}
@media(max-width:720px){.lands{grid-template-columns:repeat(2,minmax(0,1fr))}}
.han-h{display:block;margin-top:8px;font-size:14px;font-weight:400;color:var(--mute)}
.sins{display:flex;flex-wrap:wrap;justify-content:center;gap:12px}
.sin{flex:0 1 calc(25% - 9px);min-width:150px;aspect-ratio:3/4;border:1px dashed #3a3644;border-radius:6px;background:radial-gradient(70% 50% at 50% 35%,rgba(176,138,208,.10),transparent 70%),#0d0c12;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:6px;text-align:center;padding:16px}
.sin .ico{width:38px;height:38px;margin:0 0 10px;opacity:.7}
.sin .sin-t{font-size:15px;color:#cdb6e6;margin-bottom:6px;word-break:keep-all}
.sin b{font-size:20px;letter-spacing:.2em;color:#cfc9d8}
.sin small{font-size:13px;color:var(--mute)}
.sin .no{font:26px/1 "Pinyon Script",cursive;color:#b08ad0;opacity:.8}
@media(max-width:600px){.sin{flex-basis:calc(50% - 6px);min-width:0}}
.signin{position:fixed;inset:0;z-index:30;background:#05070c;display:flex;align-items:center;justify-content:center;transition:opacity .9s ease,visibility .9s}
.signin.done{opacity:0;visibility:hidden}
.sig-w{position:relative;width:min(78vw,560px)}
.sig-w canvas{display:block;width:100%;height:auto;filter:drop-shadow(0 0 14px rgba(230,190,110,.28))}
.cover:not(.play),.cover:not(.play) *{animation-play-state:paused !important}
@media(prefers-reduced-motion:reduce){.signin{display:none}}
.cover{position:fixed;inset:0;z-index:0;background:#05070c;display:flex;align-items:center;justify-content:center;overflow:hidden;will-change:opacity}
.cover-space{height:92vh;height:92svh}
main{z-index:1}
.cover-bg{position:absolute;inset:-40px;background-size:cover;background-position:center;filter:blur(28px) brightness(.45);transform:scale(1.1)}
.cover-zoom{position:absolute;inset:0;display:flex;align-items:center;justify-content:center}
.sweep{position:absolute;inset:0;z-index:2;pointer-events:none;background:linear-gradient(120deg,transparent 0%,transparent 38%,rgba(255,255,255,.0) 40%,rgba(255,248,240,.85) 45%,rgba(255,255,255,1) 47%,rgba(220,200,255,.6) 50%,#05070c 58%,#05070c 100%);background-size:320% 320%;background-position:100% 100%}
@media(prefers-reduced-motion:reduce){.sweep{display:none}}
.cover-img{position:relative;height:100%;width:auto;max-width:100%;object-fit:cover;object-position:50% 30%;-webkit-mask-image:linear-gradient(90deg,transparent,#000 10%,#000 90%,transparent);mask-image:linear-gradient(90deg,transparent,#000 10%,#000 90%,transparent);will-change:transform}
.cover::after{content:"";position:absolute;inset:0;background:linear-gradient(transparent 55%,rgba(5,7,12,.85));pointer-events:none}
.cover-ui{position:absolute;left:0;right:0;bottom:clamp(28px,7vh,72px);z-index:1;display:flex;flex-direction:column;align-items:center;gap:14px}
.cover-line{margin:0;font-size:clamp(16px,2.4vw,19px);color:#e9e6f0;text-shadow:0 2px 14px #000}
.hint{display:flex;flex-direction:column;align-items:center;gap:2px;font-size:13px;color:rgba(233,230,240,.75)}
.hint svg{width:22px;height:22px}
@media(max-aspect-ratio:3/4){.cover-img{width:100%;-webkit-mask-image:none;mask-image:none}}
@media(prefers-reduced-motion:no-preference){
.sweep{animation:sweep 2.4s .3s cubic-bezier(.55,.05,.25,1) both}
.cover-zoom{animation:bloom 3.2s .6s ease-out both}
.cover-ui>*{animation:uiIn 1.2s 2.4s ease both}
.hint svg{animation:bob 1.8s 3.6s ease-in-out infinite}
@keyframes sweep{from{background-position:100% 100%}to{background-position:0% 0%}}
@keyframes bloom{0%{transform:scale(1.06);filter:brightness(1.9) saturate(.6) blur(6px)}40%{filter:brightness(1.35) saturate(.85) blur(2px)}100%{transform:scale(1);filter:none}}
@keyframes uiIn{from{opacity:0;transform:translateY(14px)}}
@keyframes bob{50%{transform:translateY(5px)}}}
@media(max-width:600px){
  .prose,.land .desc,.rank-prose,.detail .lead,.land-detail .prose{text-align:left !important}
  .prose{font-size:16px;line-height:1.8}
  .welcome{margin-top:22px}
  .detail .lead,.lore .epi,.land-detail .lsum{word-break:keep-all}
  .lore{padding:24px 18px}
  .detail{padding:20px 14px}
}
.plots{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:14px}
.plot{display:flex;flex-direction:column;background:#1a191f;border-radius:14px;overflow:hidden;color:inherit;text-decoration:none;transition:transform .25s,box-shadow .25s}
a.plot:hover{transform:translateY(-3px);box-shadow:0 14px 30px -12px rgba(0,0,0,.8)}
a.plot:focus-visible{outline:2px solid var(--night);outline-offset:3px}
.plot .pimg{position:relative;aspect-ratio:1/1;overflow:hidden;background:#000}
.plot .pimg img{display:block;width:100%;height:100%;object-fit:cover;transition:transform .4s}
a.plot:hover .pimg img{transform:scale(1.04)}
a.plot{cursor:pointer}
.plot .cnt{position:absolute;top:10px;left:10px;display:flex;align-items:center;gap:5px;padding:4px 10px 4px 8px;border-radius:9px;background:rgba(40,40,46,.82);font:600 14px/1.3 system-ui,-apple-system,"Apple SD Gothic Neo","Malgun Gothic",sans-serif;color:#fff}
.plot .cnt svg{width:15px;height:15px}
.plot .pbody{padding:12px 14px 14px;font-family:system-ui,-apple-system,"Apple SD Gothic Neo","Malgun Gothic",sans-serif}
.plot h3{margin:0 0 6px;font-size:17px;line-height:1.35;font-weight:700;color:#fff;word-break:keep-all}
.plot .pdesc{margin:0 0 6px;font-size:14px;line-height:1.45;color:#d9d8de;word-break:keep-all}
.plot .tags{margin:0;font-size:14px;color:#8d8b96;white-space:nowrap;overflow:hidden;-webkit-mask-image:linear-gradient(90deg,#000 85%,transparent);mask-image:linear-gradient(90deg,#000 85%,transparent)}
@media(max-width:720px){.plots{grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}.plot h3{font-size:15px}.plot .pdesc,.plot .tags{font-size:13px}.plot .pbody{padding:10px 11px 12px}}
img,canvas,.cover-bg{-webkit-user-drag:none;user-drag:none;-webkit-touch-callout:none;-webkit-user-select:none;user-select:none}
.bgm{position:fixed;right:max(16px,env(safe-area-inset-right));bottom:max(16px,env(safe-area-inset-bottom));z-index:25;width:48px;height:48px;border-radius:50%;border:1px solid rgba(232,220,181,.45);background:rgba(10,9,14,.72);color:#e8dcb5;display:flex;align-items:center;justify-content:center;cursor:pointer;backdrop-filter:blur(6px);box-shadow:0 6px 20px rgba(0,0,0,.5);transition:border-color .25s,transform .25s}
.bgm:hover{transform:scale(1.06);border-color:#e8dcb5}
.bgm:focus-visible{outline:2px solid #e8dcb5;outline-offset:3px}
.bgm svg{width:22px;height:22px}
.bgm .on,.bgm .bars{display:none}
.bgm[aria-pressed=true] .off{display:none}
.bgm[aria-pressed=true] .bars{display:flex}
.bgm .bars{gap:3px;align-items:flex-end;height:18px}
.bgm .bars i{width:3px;height:6px;background:currentColor;border-radius:2px}
@media(prefers-reduced-motion:no-preference){.bgm .bars i{animation:eq 1s ease-in-out infinite}.bgm .bars i:nth-child(2){animation-delay:.2s}.bgm .bars i:nth-child(3){animation-delay:.4s}@keyframes eq{50%{height:18px}}}
.ytbox{position:fixed;left:-9999px;top:0;width:1px;height:1px;overflow:hidden;pointer-events:none}
footer{text-align:center;color:var(--mute);font-size:13px;margin-top:64px}
footer .sig{font:28px/1 "Pinyon Script",cursive;color:var(--ink);display:block;margin-bottom:6px}
@media(prefers-reduced-motion:no-preference){.detail:not([hidden]){animation:rise .45s ease}@keyframes rise{from{opacity:0;transform:translateY(10px)}}}
@media(max-width:600px){.tier{gap:10px}.rank{flex-basis:calc(50% - 5px);max-width:none}.rank.top{flex-basis:100%}}
</style>
</head>
<body>
<button class="bgm" id="bgm" type="button" aria-label="배경음악 켜기" aria-pressed="false"><svg class="on" viewBox="0 0 24 24" aria-hidden="true"><path d="M4 9.5h3.5L12 5.5v13l-4.5-4H4z" fill="currentColor"/><path d="M15.5 8.8a4.5 4.5 0 0 1 0 6.4M18 6.3a8 8 0 0 1 0 11.4" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"/></svg><svg class="off" viewBox="0 0 24 24" aria-hidden="true"><path d="M4 9.5h3.5L12 5.5v13l-4.5-4H4z" fill="currentColor"/><path d="M16 9.5l5 5M21 9.5l-5 5" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"/></svg><span class="bars" aria-hidden="true"><i></i><i></i><i></i></span></button>
<div class="ytbox" aria-hidden="true"><div id="ytPlayer"></div></div>
<div class="signin" id="sig" aria-hidden="true"><div class="sig-w"><canvas id="sigCv"></canvas></div></div>
<div class="cover" id="cover" aria-hidden="true">
  <div class="cover-bg" style="background-image:url(cover4.jpg)"></div>
  <div class="cover-zoom">
    <img class="cover-img" src="cover4.jpg" alt="고딕 성당 안에 나란히 선 붉은 머리와 은발의 두 인물, Equinox 로고">
  </div>
  <div class="sweep"></div>
  <div class="cover-ui">
    <p class="cover-line">Equinox_</p>
    <span class="hint">아래로 스크롤<svg viewBox="0 0 24 24"><path d="M6 9l6 6 6-6" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/></svg></span>
  </div>
</div>

  const BUBBLE = '<svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 3.5c-5 0-9 3.3-9 7.4 0 2.4 1.4 4.5 3.5 5.9l-.8 3.4 3.9-2.1c.8.2 1.6.2 2.4.2 5 0 9-3.3 9-7.4S17 3.5 12 3.5z" fill="currentColor"/></svg>';
  document.getElementById("plots").innerHTML = PLOTS.map(pl => {
    const inner = `<div class="pimg"><img src="${esc(pl.img)}" alt="${esc(pl.title)} 표지" loading="lazy"></div>
      <div class="pbody"><h3>${esc(pl.title)}</h3><p class="pdesc">${esc(pl.desc)}</p><p class="tags">${pl.tags.map(t => "#" + esc(t)).join(" ")}</p></div>`;
    return pl.url ? `<a class="plot" href="${esc(pl.url)}" target="_blank" rel="noopener">${inner}</a>` : `<article class="plot">${inner}</article>`;
  }).join("");

  // 이미지 우클릭·드래그 저장 방지
  addEventListener("contextmenu", e => { if(e.target.closest("img, canvas, .pimg, .por, .pic, .hero, .cover")) e.preventDefault(); });
  addEventListener("dragstart", e => { if(e.target.closest("img, canvas")) e.preventDefault(); });

  // 새로고침하면 항상 맨 위에서 다시 시작
  try { history.scrollRestoration = "manual"; } catch(e){}
  const nav = performance.getEntriesByType ? performance.getEntriesByType("navigation")[0] : null;
  if(nav && nav.type === "reload" && location.hash){ history.replaceState(null, "", location.pathname + location.search); }
  scrollTo(0, 0);
  addEventListener("pageshow", e => { if(e.persisted) scrollTo(0, 0); });

  // 배경음악 (유튜브)
  const BGM_ID = "XvnqRhT3I1c";
  const bgmBtn = document.getElementById("bgm");
  let yt = null, ytReady = false, wantPlay = true, userOff = false, mutedStart = false;
  const setBtn = on => { bgmBtn.setAttribute("aria-pressed", String(on)); bgmBtn.setAttribute("aria-label", on ? "배경음악 끄기" : "배경음악 켜기"); };
  const loadYT = () => {
    if(window.YT && YT.Player){ makePlayer(); return; }
    if(document.getElementById("ytApi")) return;
    const sc = document.createElement("script"); sc.id = "ytApi"; sc.src = "https://www.youtube.com/iframe_api";
    sc.onerror = () => setBtn(false);
    document.head.appendChild(sc);
  };
  const makePlayer = () => {
    if(yt) return;
    yt = new YT.Player("ytPlayer", { width: 1, height: 1, videoId: BGM_ID,
      playerVars: { autoplay: 0, controls: 0, loop: 1, playlist: BGM_ID, playsinline: 1, rel: 0 },
      events: {
        onReady: () => { ytReady = true; try { yt.setVolume(50); yt.unMute(); } catch(e){}
          if(!wantPlay) return;
          yt.playVideo();
          // 소리 있는 자동 재생이 막히면, 소리 끈 채로 먼저 틀고 첫 터치 때 소리를 켜요
          setTimeout(() => { if(wantPlay && yt.getPlayerState() !== 1){ mutedStart = true; yt.mute(); yt.playVideo(); } }, 900);
        },
        onStateChange: e => { if(e.data === 1) setBtn(true); else if(e.data === 2) setBtn(false); else if(e.data === 0){ yt.seekTo(0); yt.playVideo(); } },
        onError: () => setBtn(false)
      } });
  };
  window.onYouTubeIframeAPIReady = makePlayer;
  const play = () => { wantPlay = true; setBtn(true); if(ytReady){ yt.unMute(); yt.setVolume(50); mutedStart = false; yt.playVideo(); } else loadYT(); };
  const stop = () => { wantPlay = false; setBtn(false); if(ytReady) yt.pauseVideo(); };
  bgmBtn.addEventListener("click", e => { e.stopPropagation(); if(bgmBtn.getAttribute("aria-pressed") === "true"){ userOff = true; stop(); } else { userOff = false; play(); } });
  // 첫 터치·클릭 때 자동으로 시작 (브라우저가 그 전 자동 재생은 막아요)
  const firstTouch = e => { removeEventListener("pointerdown", firstTouch, true); removeEventListener("keydown", firstTouch, true); removeEventListener("touchend", firstTouch, true); if(!userOff && !e.target.closest("#bgm")) play(); };
  addEventListener("touchend", firstTouch, true);
  addEventListener("pointerdown", firstTouch, true);
  addEventListener("keydown", firstTouch, true);
  loadYT();

  const fromHash = () => { show(location.hash.slice(1) || null); if(!detail.hidden) requestAnimationFrame(() => detail.scrollIntoView({behavior:"smooth", block:"start"})); };
  addEventListener("hashchange", fromHash);
  fromHash();
}
